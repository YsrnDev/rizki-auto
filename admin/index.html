<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RizkiAuto Admin</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Base Global Styles (for vars) -->
    <link rel="stylesheet" href="../assets/css/style.css?v=68">
    
    <style>
        body {
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: var(--bg-surface);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid var(--border);
            min-height: 600px;
        }

        /* Left Side: Branding / Banner */
        .login-banner {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, #072a61 100%);
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative circles for banner */
        .login-banner::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(40px);
        }
        .login-banner::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(40px);
        }

        .login-banner h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 16px;
            z-index: 1;
        }
        .login-banner p {
            font-size: 1.125rem;
            opacity: 0.9;
            line-height: 1.6;
            z-index: 1;
        }
        .login-banner .banner-footer {
            z-index: 1;
            font-size: 0.875rem;
            opacity: 0.7;
        }

        /* Right Side: Form */
        .login-form-container {
            flex: 1;
            padding: 64px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-surface);
        }
        
        .login-logo-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: flex-start;
        }
        
        #login-logo {
            height: 56px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .login-form-container h2 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .login-form-container > p {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-main);
        }
        
        /* Input with icon */
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.25rem;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .error-msg {
            background: #fef2f2;
            color: #ef4444;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 24px;
            display: none;
            border: 1px solid #f87171;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Back to site */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 32px;
            font-weight: 500;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .login-wrapper {
                flex-direction: column;
                min-height: auto;
            }
            .login-banner {
                display: none;
            }
            .login-form-container {
                padding: 40px 24px;
                flex: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Left Branding Banner -->
        <div class="login-banner">
            <div>
                <i class="ri-dashboard-3-line" style="font-size: 3rem; margin-bottom: 24px; display: inline-block;"></i>
                <h1>Sistem Manajemen<br>RizkiAuto</h1>
                <p>Kelola inventaris kendaraan, perbarui testimoni, kelola FAQ, dan pantau pengaturan website Anda dengan mudah dan aman.</p>
            </div>
            <div class="banner-footer">
                &copy; <script>document.write(new Date().getFullYear())</script> RizkiAuto MUF. All rights reserved.
            </div>
        </div>
        
        <!-- Right Login Form -->
        <div class="login-form-container">
            <div class="login-logo-wrapper">
                <img id="login-logo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Logo">
            </div>
            
            <h2>Selamat Datang</h2>
            <p>Silakan masuk ke panel kendali administrator.</p>
            
            <div id="error-msg" class="error-msg" style="display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Alamat Email</label>
                    <div class="input-wrapper">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="email" class="form-input" placeholder="admin@rizkiauto.id" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="btn-submit">
                    Masuk ke Sistem <i class="ri-arrow-right-line"></i>
                </button>
            </form>
            
            <a href="../index.html" class="back-link">
                <i class="ri-arrow-left-line"></i> Kembali ke Website
            </a>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
        // Check if already logged in
        sbClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        // Fetch Dynamic Logo
        async function loadLoginLogo() {
            try {
                const { data } = await sbClient.from('settings').select('value').eq('key', 'website_logo').single();
                if (data && data.value) {
                    const logoEl = document.getElementById('login-logo');
                    if (logoEl) logoEl.src = data.value;
                }
            } catch (e) {
                console.error('Error fetching logo', e);
            }
        }
        document.addEventListener('DOMContentLoaded', loadLoginLogo);

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            
            btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Memproses...';
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await sbClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerHTML = '<i class="ri-error-warning-line"></i> Email atau kata sandi salah.';
                errorMsg.style.display = 'flex';
                btn.innerHTML = 'Masuk ke Sistem <i class="ri-arrow-right-line"></i>';
            } else {
                btn.innerHTML = '<i class="ri-check-line"></i> Berhasil Masuk!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }
        });
    </script>
</body>
</html>
