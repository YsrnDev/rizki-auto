<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RizkiAuto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=63">
    <style>
        body {
            background-color: var(--bg-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .login-card {
            background: var(--bg-surface);
            padding: 48px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .login-card img {
            height: 48px;
            margin-bottom: 24px;
        }
        .login-card h2 {
            font-family: var(--font-display);
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-main);
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-body);
            color: var(--text-main);
            font-family: inherit;
            transition: var(--transition);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            font-size: 1.125rem;
            margin-top: 12px;
            justify-content: center;
        }
        #login-error {
            color: #ef4444;
            background: #fef2f2;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="../assets/img/muf-logo.avif" alt="MUF Logo">
        <h2>Admin Panel</h2>
        <p>Silakan masuk untuk mengelola konten website</p>

        <div id="login-error">Email atau password salah.</div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="admin@rizkiauto.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login" id="login-btn">
                Masuk <i class="ri-login-circle-line"></i>
            </button>
        </form>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script>
        // Cek jika sudah login, langsung ke dashboard
        sbClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');

            btn.innerHTML = 'Memproses... <i class="ri-loader-4-line ri-spin"></i>';
            btn.style.opacity = '0.7';
            errorDiv.style.display = 'none';

            const { data, error } = await sbClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Gagal masuk: " + error.message;
                btn.innerHTML = 'Masuk <i class="ri-login-circle-line"></i>';
                btn.style.opacity = '1';
            } else {
                btn.innerHTML = 'Berhasil! Mengalihkan...';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-secondary');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
        });
    </script>
</body>
</html>
